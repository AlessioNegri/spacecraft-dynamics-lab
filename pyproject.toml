[project]
name = "astro"
version = "0.1.0"
description = "Orbital mechanics utilities"
requires-python = ">=3.14"
authors = [{ name = "Alessio Negri"}]
maintainers = [{ name = "Alessio Negri" }]
dependencies = ["astropy", "numpy", "scipy"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["astro"]